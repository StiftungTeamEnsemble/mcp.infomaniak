[package]
name = "ensemble-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs", "sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.5", features = ["json", "form", "query"] }
aes-gcm = "0.11.1"
base64 = "0.23.1"
sha2 = "0.11.1"
rand = "0.10.3"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
url = "2.5.8"
chrono = "0.4.45"
chrono-tz = "0.10.4"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
tempfile = "3.27.0"

[[test]]
name = "integration"
path = "test/integration.rs"
