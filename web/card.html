<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:14px/1.5 system-ui;margin:0;color:var(--color-text-primary,#30323b)}article{border:1px solid #e0e2e9;border-radius:10px;padding:18px;margin:8px}h2{font-size:16px;margin:0 0 5px}p{color:#737885;margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere}button{background:transparent;color:#6253ab;border:0;padding:10px 0 0;cursor:pointer}small{color:#8b8f9a}</style></head><body><div id="cards"><article><h2>Team Ensemble</h2><p>Results will appear here.</p></article></div><script>
let seq=0;let last=null;
function send(method,params){parent.postMessage({jsonrpc:'2.0',id:++seq,method,params},'*')}
function notify(method,params){parent.postMessage({jsonrpc:'2.0',method,params},'*')}
function render(result){if(!result)return;last=result;const payload=result.structuredContent||result;const data=payload.data;const items=Array.isArray(data)?data:Array.isArray(data?.calendars)?data.calendars:[data];const root=document.getElementById('cards');root.replaceChildren();for(const item of items.slice(0,30)){if(!item||typeof item!=='object')continue;const card=document.createElement('article');const title=document.createElement('h2');title.textContent=item.subject||item.title||item.display_name||item.name||item.filename||item.username||'Result';card.append(title);const p=document.createElement('p');p.textContent=[item.preview||item.description||item.message||'',item.start||item.date||'',item.bookable_resource_name||''].filter(Boolean).join('\n').slice(0,1800);card.append(p);const link=item.source_url||item.url||payload.context?.source_url;if(link){try{const u=new URL(link);if(u.protocol==='https:'&&(u.hostname==='infomaniak.com'||u.hostname.endsWith('.infomaniak.com'))){const b=document.createElement('button');b.textContent='Open in Infomaniak ↗';b.onclick=()=>window.openai?.openExternal?window.openai.openExternal({href:u.href}):send('ui/open-link',{url:u.href});card.append(b)}}catch{}}const meta=document.createElement('small');meta.textContent=item.id||item.uid||item.thread_uid||'';card.append(meta);root.append(card)}notify('ui/notifications/size-changed',{height:document.body.scrollHeight})}
window.addEventListener('message',e=>{if(e.source!==parent||e.data?.jsonrpc!=='2.0')return;if(e.data.method==='ui/notifications/tool-result')render(e.data.params);if(e.data.id===1&&e.data.result)notify('ui/notifications/initialized',{})});
window.addEventListener('openai:set_globals',e=>render(e.detail?.globals?.toolOutput));
send('ui/initialize',{appInfo:{name:'Team Ensemble cards',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'});
if(window.openai?.toolOutput)render(window.openai.toolOutput);
</script></body></html>
